# Serves the static site on port 8080 behind Dokploy's Traefik, which handles
# HTTPS. Nothing here is specific to a domain.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Files are not fingerprinted, so let browsers keep them but check for a
    # newer copy each time; a redeploy then shows up on the next visit.
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";

    location / {
        try_files $uri $uri/ =404;
    }
}
